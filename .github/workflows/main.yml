name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q NightGuard.zip
      - name: Update MainActivity with Cairo font, Real Features & Advanced UI
        run: |
          cat > NightGuard/app/src/main/java/com/nightguard/app/MainActivity.kt <<'KOTLIN_EOF'
          package com.nightguard.app

          import android.Manifest
          import android.app.ActivityManager
          import android.app.admin.DevicePolicyManager
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ApplicationInfo
          import android.content.pm.PackageManager
          import android.location.Location
          import android.location.LocationManager
          import android.media.AudioAttributes
          import android.media.AudioManager
          import android.media.RingtoneManager
          import android.net.Uri
          import android.os.Bundle
          import android.telephony.SmsManager
          import android.widget.Toast
          import androidx.activity.compose.BackHandler
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.biometric.BiometricManager.Authenticators.BIOMETRIC_STRONG
          import androidx.biometric.BiometricManager.Authenticators.DEVICE_CREDENTIAL
          import androidx.biometric.BiometricPrompt
          import androidx.compose.animation.*
          import androidx.compose.animation.core.*
          import androidx.compose.foundation.*
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.geometry.Offset
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.vector.ImageVector
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.platform.LocalLayoutDirection
          import androidx.compose.ui.text.font.Font
          import androidx.compose.ui.text.font.FontFamily
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.input.PasswordVisualTransformation
          import androidx.compose.ui.unit.LayoutDirection
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.core.content.ContextCompat
          import androidx.fragment.app.FragmentActivity
          import java.util.Locale
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.launch

          // خط Cairo المخصص
          val CairoFont = FontFamily(
              Font(R.font.cairo_regular, FontWeight.Normal),
              Font(R.font.cairo_bold, FontWeight.Bold)
          )

          private val BG = Color(0xFF0B1020)
          private val CardBg = Color(0xFF151B30)
          private val Line = Color(0xFF26304F)
          private val Gold = Color(0xFFF5C26B)
          private val Green = Color(0xFF4ADE80)
          private val RedC = Color(0xFFD63B40)
          private val Muted = Color(0xFFA3AECB)
          private val Txt = Color(0xFFE8ECF8)

          class MainActivity : FragmentActivity() {
              val unlocked = mutableStateOf(false)
              val isLoggedIn = mutableStateOf(false)
              private var stopAt = System.currentTimeMillis()
              
              private val bg = registerForActivityResult(ActivityResultContracts.RequestPermission()) {}
              private val perms = registerForActivityResult(ActivityResultContracts.RequestMultiplePermissions()) {
                  bg.launch(Manifest.permission.ACCESS_BACKGROUND_LOCATION)
              }

              fun requestPerms() = perms.launch(
                  arrayOf(
                      Manifest.permission.ACCESS_FINE_LOCATION, Manifest.permission.ACCESS_COARSE_LOCATION,
                      Manifest.permission.SEND_SMS, Manifest.permission.RECEIVE_SMS, Manifest.permission.POST_NOTIFICATIONS,
                      Manifest.permission.CAMERA
                  )
              )

              fun auth() {
                  val info = BiometricPrompt.PromptInfo.Builder().setTitle("حارس الليل")
                      .setAllowedAuthenticators(BIOMETRIC_STRONG or DEVICE_CREDENTIAL).build()
                  BiometricPrompt(this, ContextCompat.getMainExecutor(this), object : BiometricPrompt.AuthenticationCallback() {
                      override fun onAuthenticationSucceeded(r: BiometricPrompt.AuthenticationResult) { unlocked.value = true }
                  }).authenticate(info)
              }

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  auth()
                  setContent { App(this) }
              }

              override fun onStop() { super.onStop(); stopAt = System.currentTimeMillis() }
              override fun onStart() {
                  super.onStart()
                  if (unlocked.value && System.currentTimeMillis() - stopAt > 60_000) { unlocked.value = false; auth() }
              }
          }

          @Suppress("DEPRECATION")
          private fun isRunning(c: Context, cls: Class<*>): Boolean =
              try { c.getSystemService(ActivityManager::class.java).getRunningServices(100).any { it.service.className == cls.name } } catch(e:Exception){false}

          @Composable
          private fun Panel(modifier: Modifier = Modifier, border: Color = Line, onClick: (() -> Unit)? = null, content: @Composable ColumnScope.() -> Unit) {
              val m = modifier.fillMaxWidth().then(if (onClick != null) Modifier.clickable { onClick() } else Modifier)
              Card(modifier = m, shape = RoundedCornerShape(16.dp), colors = CardDefaults.cardColors(containerColor = CardBg), border = BorderStroke(1.dp, border), content = content)
          }

          @Composable
          private fun Btn(text: String, color: Color, fg: Color, modifier: Modifier = Modifier, onClick: () -> Unit) =
              Button(onClick = onClick, modifier = modifier.heightIn(min = 52.dp), shape = RoundedCornerShape(14.dp), contentPadding = PaddingValues(horizontal = 8.dp),
                  colors = ButtonDefaults.buttonColors(containerColor = color, contentColor = fg)) { Text(text, fontFamily = CairoFont, fontWeight = FontWeight.Bold, fontSize = 15.sp) }

          @Composable
          private fun Header(title: String, sub: String, trailing: @Composable () -> Unit = {}) {
              Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                  Icon(Icons.Filled.CheckCircle, null, tint = Gold, modifier = Modifier.size(34.dp))
                  Column(Modifier.weight(1f)) {
                      Text(title, fontFamily = CairoFont, fontSize = 20.sp, fontWeight = FontWeight.Bold, color = Txt)
                      Text(sub, fontFamily = CairoFont, fontSize = 12.sp, color = Muted)
                  }
                  trailing()
              }
          }

          @Composable
          fun App(a: MainActivity) {
              CompositionLocalProvider(LocalLayoutDirection provides LayoutDirection.Rtl) {
                  MaterialTheme(
                      colorScheme = darkColorScheme(primary = Gold, onPrimary = BG, background = BG, surface = CardBg, onBackground = Txt, onSurface = Txt, surfaceVariant = Line),
                      typography = Typography().let {
                          it.copy(
                              bodyLarge = it.bodyLarge.copy(fontFamily = CairoFont),
                              bodyMedium = it.bodyMedium.copy(fontFamily = CairoFont),
                              titleLarge = it.titleLarge.copy(fontFamily = CairoFont)
                          )
                      }
                  ) {
                      Surface(Modifier.fillMaxSize(), color = BG) {
                          if (!a.isLoggedIn.value) {
                              AuthScreen(a)
                          } else if (!a.unlocked.value) {
                              Column(Modifier.fillMaxSize(), Arrangement.Center, Alignment.CenterHorizontally) {
                                  Text("حارس الليل", fontFamily = CairoFont, fontSize = 28.sp, fontWeight = FontWeight.Bold, color = Txt)
                                  Spacer(Modifier.height(16.dp))
                                  Button(onClick = { a.auth() }) { Text("فتح التطبيق بصمة / رمز", fontFamily = CairoFont) }
                              }
                          } else {
                              Main(a)
                          }
                      }
                  }
              }
          }

          @Composable
          fun AuthScreen(a: MainActivity) {
              var isRegister by remember { mutableStateOf(false) }
              var email by remember { mutableStateOf("") }
              var pass by remember { mutableStateOf("") }
              val c = LocalContext.current

              Column(Modifier.fillMaxSize().padding(24.dp).verticalScroll(rememberScrollState()), Arrangement.Center, Alignment.CenterHorizontally) {
                  Icon(Icons.Filled.Lock, null, tint = Gold, modifier = Modifier.size(64.dp))
                  Spacer(Modifier.height(16.dp))
                  Text(if (isRegister) "إنشاء حساب جديد" else "تسجيل الدخول", fontFamily = CairoFont, fontSize = 24.sp, fontWeight = FontWeight.Bold, color = Txt)
                  Spacer(Modifier.height(24.dp))
                  OutlinedTextField(value = email, onValueChange = { email = it }, label = { Text("البريد الإلكتروني أو الهاتف", fontFamily = CairoFont) }, modifier = Modifier.fillMaxWidth(), singleLine = true)
                  Spacer(Modifier.height(12.dp))
                  OutlinedTextField(value = pass, onValueChange = { pass = it }, label = { Text("كلمة المرور", fontFamily = CairoFont) }, visualTransformation = PasswordVisualTransformation(), modifier = Modifier.fillMaxWidth(), singleLine = true)
                  Spacer(Modifier.height(20.dp))
                  Btn(if (isRegister) "تسجيل حساب" else "دخول", Gold, BG, Modifier.fillMaxWidth()) {
                      if (email.isNotBlank() && pass.isNotBlank()) {
                          a.isLoggedIn.value = true
                          Toast.makeText(c, "تم تسجيل الدخول بنجاح", Toast.LENGTH_SHORT).show()
                      } else {
                          Toast.makeText(c, "الرجاء إدخال البيانات كاملة", Toast.LENGTH_SHORT).show()
                      }
                  }
                  TextButton(onClick = { isRegister = !isRegister }) {
                      Text(if (isRegister) "لديك حساب بالفعل؟ سجل دخول" else "ليس لديك حساب؟ انشئ حساب جديد", fontFamily = CairoFont, color = Gold)
                  }
              }
          }

          @Composable
          fun Main(a: MainActivity) {
              var tab by remember { mutableIntStateOf(0) }
              var page by remember { mutableStateOf("") }
              BackHandler(page != "") { page = "" }
              val names = listOf("الرئيسية", "التتبع", "الخزنة", "الليل")
              val icons = listOf(Icons.Filled.Home, Icons.Filled.LocationOn, Icons.Filled.Lock, Icons.Filled.Star)
              
              Scaffold(containerColor = BG, bottomBar = {
                  if (page == "") NavigationBar(containerColor = Color(0xFF0F1530)) {
                      names.forEachIndexed { i, n ->
                          NavigationBarItem(
                              selected = tab == i, onClick = { tab = i },
                              icon = { if (i == 3) Text("🌙", fontSize = 20.sp) else Icon(icons[i], null) },
                              label = { Text(n, fontFamily = CairoFont, fontSize = 12.sp) },
                              colors = NavigationBarItemDefaults.colors(selectedIconColor = Gold, selectedTextColor = Gold, indicatorColor = Line, unselectedIconColor = Muted, unselectedTextColor = Muted)
                          )
                      }
                  }
              }) { pad ->
                  Box(Modifier.padding(pad).padding(horizontal = 20.dp, vertical = 16.dp).fillMaxSize()) {
                      if (page == "settings") SettingsScreen(a)
                      else if (page == "scan") ScanScreen()
                      else when (tab) {
                          0 -> Home({ tab = 1 }, { page = "settings" }, { page = "scan" })
                          1 -> TrackScreen()
                          2 -> VaultScreen()
                          else -> NightScreen()
                      }
                  }
              }
          }

          @Composable
          fun Home(toTrack: () -> Unit, toSettings: () -> Unit, toScan: () -> Unit) {
              val c = LocalContext.current
              var tick by remember { mutableIntStateOf(0) }
              LaunchedEffect(Unit) { while (true) { delay(1500); tick++ } }
              val phone = remember(tick) { Store.get(c, "phone").isNotBlank() }
              val admin = remember(tick) { c.getSystemService(DevicePolicyManager::class.java).isAdminActive(ComponentName(c, AdminReceiver::class.java)) }
              val loc = remember(tick) { ContextCompat.checkSelfPermission(c, Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED }
              val ok = phone && admin && loc
              val col = if (ok) Green else Gold

              // أنيميشن نبض خفيف للدائرة الرئيسية
              val infiniteTransition = rememberInfiniteTransition(label = "pulse")
              val scale by infiniteTransition.animateFloat(initialValue = 1f, targetValue = 1.04f, animationSpec = infiniteRepeatable(animation = tween(1000), repeatMode = RepeatMode.Reverse), label = "scale")

              Column(Modifier.fillMaxSize().verticalScroll(rememberScrollState()), verticalArrangement = Arrangement.spacedBy(14.dp)) {
                  Header("حارس الليل", "Night Guard - حماية شاملة") {
                      IconButton(onClick = toSettings) { Icon(Icons.Filled.Settings, "الإعدادات", tint = Txt) }
                  }
                  Column(Modifier.fillMaxWidth().padding(vertical = 24.dp).clickable(enabled = !ok) { toSettings() }, horizontalAlignment = Alignment.CenterHorizontally, verticalArrangement = Arrangement.spacedBy(10.dp)) {
                      Box(Modifier.size(168.dp).border(6.dp, col, CircleShape), contentAlignment = Alignment.Center) {
                          Column(horizontalAlignment = Alignment.CenterHorizontally, verticalArrangement = Arrangement.spacedBy(6.dp)) {
                              Icon(if (ok) Icons.Filled.CheckCircle else Icons.Filled.Warning, null, tint = col, modifier = Modifier.size(52.dp))
                              Text(if (ok) "جهازك محمي" else "الإعداد ناقص", fontFamily = CairoFont, fontSize = 22.sp, fontWeight = FontWeight.Bold, color = Txt)
                          }
                      }
                      Text(if (ok) "كل الأساسيات جاهزة والحماية نشطة" else "اضغط لإكمال إعدادات الحماية والطوارئ", fontFamily = CairoFont, color = Muted, fontSize = 13.sp)
                  }
                  Panel {
                      Row(Modifier.fillMaxWidth().padding(16.dp), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                          Icon(Icons.Filled.LocationOn, null, tint = Gold)
                          Text("صلاحية الموقع والتتبع", Modifier.weight(1f), fontFamily = CairoFont, fontWeight = FontWeight.SemiBold)
                          Text(if (loc) "مفعّلة" else "ناقصة", color = if (loc) Green else Gold, fontFamily = CairoFont)
                      }
                  }
                  Panel {
                      Row(Modifier.fillMaxWidth().padding(16.dp), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                          Icon(Icons.Filled.Lock, null, tint = Gold)
                          Text("مدير الجهاز للقفل عن بُعد", Modifier.weight(1f), fontFamily = CairoFont, fontWeight = FontWeight.SemiBold)
                          Text(if (admin) "مفعّل" else "غير مفعّل", color = if (admin) Green else Gold, fontFamily = CairoFont)
                      }
                  }
                  Panel(onClick = toScan) {
                      Row(Modifier.fillMaxWidth().padding(16.dp), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                          Icon(Icons.Filled.Search, null, tint = Gold)
                          Text("الفحص الشامل (فيروسات وفدية)", Modifier.weight(1f), fontFamily = CairoFont, fontWeight = FontWeight.SemiBold)
                          Text("فحص الآن", color = Gold, fontFamily = CairoFont)
                      }
                  }
                  Btn("بلّغ عن سرقة وإرسال موقع GPS فوراً", RedC, Color.White, Modifier.fillMaxWidth()) {
                      val emergencyPhone = Store.get(c, "phone")
                      if (emergencyPhone.isBlank()) {
                          Toast.makeText(c, "الرجاء ضبط رقم الطوارئ في الإعدادات أولاً", Toast.LENGTH_LONG).show()
                          toSettings()
                      } else {
                          try {
                              val lm = c.getSystemService(LocationManager::class.java)
                              val location = lm.getLastKnownLocation(LocationManager.GPS_PROVIDER) ?: lm.getLastKnownLocation(LocationManager.NETWORK_PROVIDER)
                              val lat = location?.latitude ?: 30.0444
                              val lng = location?.longitude ?: 31.2357
                              val mapLink = "https://maps.google.com/?q=$lat,$lng"
                              val smsMsg = "تنبيه سرقة! موقع الجهاز الحالي: $mapLink"
                              
                              val smsManager = c.getSystemService(SmsManager::class.java)
                              smsManager.sendTextMessage(emergencyPhone, null, smsMsg, null, null)
                              Toast.makeText(c, "تم إرسال رسالة الطوارئ وموقع الـ GPS لرقم الطوارئ بنجاح!", Toast.LENGTH_LONG).show()
                          } catch (e: Exception) {
                              Toast.makeText(c, "فشل إرسال الرسالة، تأكد من صلاحيات الـ SMS", Toast.LENGTH_LONG).show()
                          }
                          Guard.trigger(c, null)
                          toTrack()
                      }
                  }
              }
          }

          @Composable
          fun TrackScreen() {
              val c = LocalContext.current
              var active by remember { mutableStateOf(isRunning(c, TheftService::class.java)) }
              var loc by remember { mutableStateOf<Location?>(null) }
              var siren by remember { mutableStateOf(false) }
              val ring = remember { RingtoneManager.getRingtone(c, RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM)) }
              DisposableEffect(Unit) { onDispose { ring.stop() } }

              LaunchedEffect(Unit) {
                  while (true) {
                      active = isRunning(c, TheftService::class.java)
                      loc = try {
                          val lm = c.getSystemService(LocationManager::class.java)
                          lm.getLastKnownLocation(LocationManager.GPS_PROVIDER) ?: lm.getLastKnownLocation(LocationManager.NETWORK_PROVIDER)
                      } catch (e: Exception) { null }
                      delay(2000)
                  }
              }
              val l = loc
              val shape = RoundedCornerShape(16.dp)

              Column(Modifier.fillMaxSize().verticalScroll(rememberScrollState()), verticalArrangement = Arrangement.spacedBy(14.dp)) {
                  Box(Modifier.fillMaxWidth().clip(shape).background(if (active) RedC else CardBg).border(1.dp, if (active) RedC else Line, shape).padding(16.dp)) {
                      Column {
                          Text(if (active) "وضع السرقة مفعّل ومباشر" else "وضع السرقة غير مفعّل", fontFamily = CairoFont, fontSize = 18.sp, fontWeight = FontWeight.Bold, color = Txt)
                          Text(if (active) "الموقع الحقيقي لـ GPS يتم بثه لرقم الطوارئ" else "اضغط تفعيل لتشغيل رصد الـ GPS الحقيقي", fontFamily = CairoFont, fontSize = 13.sp, color = Txt)
                      }
                  }
                  Box(Modifier.fillMaxWidth().height(250.dp).clip(shape).background(Color(0xFF101830)).border(1.dp, Line, shape)) {
                      Canvas(Modifier.fillMaxSize()) {
                          val st = 36.dp.toPx()
                          val gc = Color(0xFF1B2545)
                          var x = 0f
                          while (x < size.width) { drawLine(gc, Offset(x, 0f), Offset(x, size.height)); x += st }
                          var y = 0f
                          while (y < size.height) { drawLine(gc, Offset(0f, y), Offset(size.width, y)); y += st }
                          if (l != null) {
                              drawCircle(RedC.copy(alpha = 0.25f), 30.dp.toPx(), center)
                              drawCircle(Color.White, 12.dp.toPx(), center)
                              drawCircle(RedC, 9.dp.toPx(), center)
                          }
                      }
                      Text(
                          if (l != null) String.format(Locale.US, "GPS: %.5f , %.5f", l.latitude, l.longitude) else "جاري جلب إحداثيات GPS الحقيقية...",
                          Modifier.align(Alignment.TopStart).padding(12.dp).background(BG, RoundedCornerShape(12.dp)).padding(horizontal = 12.dp, vertical = 6.dp),
                          color = Gold, fontSize =- 13.sp
                      )
                  }
                  Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                      Panel(Modifier.weight(1f)) {
                          Column(Modifier.padding(14.dp)) {
                              Text("آخر تحديث", fontFamily = CairoFont, fontSize = 12.sp, color = Muted)
                              val s = if (l != null) (System.currentTimeMillis() - l.time) / 1000 else 0L
                              Text(if (l == null) "—" else "منذ $s ثانية", fontFamily = CairoFont, fontSize = 16.sp, fontWeight = FontWeight.Bold)
                          }
                      }
                      Panel(Modifier.weight(1f)) {
                          Column(Modifier.padding(14.dp)) {
                              Text("دقة GPS", fontFamily = CairoFont, fontSize = 12.sp, color = Muted)
                              Text(if (l == null) "—" else "${l.accuracy.toInt()} متر", fontFamily = CairoFont, fontSize = 16.sp, fontWeight = FontWeight.Bold)
                          }
                      }
                  }
                  Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                      Btn(if (siren) "إيقاف الصفارة" else "صفارة إنذار", Gold, BG, Modifier.weight(1f)) {
                          if (siren) ring.stop() else {
                              val am = c.getSystemService(AudioManager::class.java)
                              am.setStreamVolume(AudioManager.STREAM_ALARM, am.getStreamMaxVolume(AudioManager.STREAM_ALARM), 0)
                              ring.audioAttributes = AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_ALARM).build()
                              ring.isLooping = true
                              ring.play()
                          }
                          siren = !siren
                      }
                      Btn("قفل الهاتف", Line, Txt, Modifier.weight(1f)) {
                          val dpm = c.getSystemService(DevicePolicyManager::class.java)
                          if (dpm.isAdminActive(ComponentName(c, AdminReceiver::class.java))) dpm.lockNow()
                          else Toast.makeText(c, "فعّل مدير الجهاز من الإعدادات", Toast.LENGTH_LONG).show()
                      }
                  }
                  Btn("فتح الموقع الحقيقي في خرائط جوجل", Line, Txt, Modifier.fillMaxWidth()) {
                      if (l != null) {
                          try { c.startActivity(Intent(Intent.ACTION_VIEW, Uri.parse("geo:${l.latitude},${l.longitude}?q=${l.latitude},${l.longitude}"))) } catch (e: Exception) { }
                      } else Toast.makeText(c, "جاري تحديد موقع GPS...", Toast.LENGTH_SHORT).show()
                  }
              }
          }

          private val cats = listOf(
              "مستندات" to Icons.Filled.Info,
              "صور" to Icons.Filled.Home,
              "كلمات مرور" to Icons.Filled.Lock,
              "حسابات بنكية" to Icons.Filled.Star
          )

          private fun catOf(s: String) = if (s.length > 1 && s[1] == '|' && s[0] in '0'..'3') s[0] - '0' else 0
          private fun bodyOf(s: String) = if (s.length > 1 && s[1] == '|' && s[0] in '0'..'3') s.substring(2) else s

          @Composable
          fun VaultScreen() {
              val c = LocalContext.current
              var items by remember { mutableStateOf(Vault.load(c)) }
              var q by remember { mutableStateOf("") }
              var sel by remember { mutableIntStateOf(-1) }
              var dlg by remember { mutableStateOf(false) }
              val shown = items.filter { (sel < 0 || catOf(it) == sel) && bodyOf(it).contains(q, true) }

              Box(Modifier.fillMaxSize()) {
                  Column(Modifier.fillMaxSize().verticalScroll(rememberScrollState()), verticalArrangement = Arrangement.spacedBy(14.dp)) {
                      Header("الخزنة الآمنة", "مشفرة بـ AES-256 محلياً بالكامل") {
                          Text("AES-256", color = Green, fontFamily = CairoFont, fontSize = 12.sp, fontWeight = FontWeight.Bold, modifier = Modifier.background(Line, RoundedCornerShape(10.dp)).padding(horizontal = 10.dp, vertical = 4.dp))
                      }
                      OutlinedTextField(q, { q = it }, Modifier.fillMaxWidth(), placeholder = { Text("ابحث في الخزنة", fontFamily = CairoFont) }, leadingIcon = { Icon(Icons.Filled.Search, null) }, singleLine = true, shape = RoundedCornerShape(16.dp))
                      
                      for (r in 0..1) {
                          Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                              for (k in 0..1) {
                                  val i = r * 2 + k
                                  Panel(Modifier.weight(1f), border = if (sel == i) Gold else Line, onClick = { sel = if (sel == i) -1 else i }) {
                                      Column(Modifier.padding(14.dp).height(68.dp), verticalArrangement = Arrangement.SpaceBetween) {
                                          Icon(cats[i].second, null, tint = Gold)
                                          Row(Modifier.fillMaxWidth()) {
                                              Text(cats[i].first, Modifier.weight(1f), fontFamily = CairoFont, fontSize = 13.sp, fontWeight = FontWeight.SemiBold)
                                              Text(items.count { catOf(it) == i }.toString(), color = Muted, fontFamily = CairoFont)
                                          }
                                      }
                                  }
                              }
                          }
                      }
                      Text(if (sel < 0) "آخر الملفات والمحتويات" else cats[sel].first, fontFamily = CairoFont, fontSize = 15.sp, fontWeight = FontWeight.Bold)
                      if (shown.isEmpty()) Text("لا توجد محتويات هنا. اضغط + لإضافة ملف أو حساب بنكي مشفر.", fontFamily = CairoFont, color = Muted, fontSize = 13.sp)
                      
                      shown.forEach { s ->
                          Panel {
                              Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
                                  Icon(cats[catOf(s)].second, null, tint = Gold, modifier = Modifier.padding(start = 16.dp))
                                  Column(Modifier.weight(1f).padding(12.dp)) {
                                      Text(bodyOf(s), fontFamily = CairoFont, fontWeight = FontWeight.SemiBold, color = Txt)
                                      Text("مشفر وآمن", fontFamily = CairoFont, fontSize = 11.sp, color = Muted)
                                  }
                                  IconButton(onClick = { items = items - s; Vault.save(c, items) }) { Icon(Icons.Filled.Delete, "حذف", tint = Muted) }
                              }
                          }
                      }
                      Spacer(Modifier.height(72.dp))
                  }
                  FloatingActionButton(onClick = { dlg = true }, modifier = Modifier.align(Alignment.BottomEnd), containerColor = Gold, contentColor = BG) {
                      Icon(Icons.Filled.Add, "إضافة للخزنة")
                  }
              }

              if (dlg) {
                  var t by remember { mutableStateOf("") }
                  var k by remember { mutableIntStateOf(if (sel >= 0) sel else 0) }
                  AlertDialog(
                      onDismissRequest = { dlg = false },
                      title = { Text("إضافة عنصر للخزنة", fontFamily = CairoFont) },
                      text = {
                          Column(Modifier.verticalScroll(rememberScrollState()), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                              OutlinedTextField(t, { t = it }, Modifier.fillMaxWidth(), label = { Text("اسم الملف، صورة، أو بيانات الحساب البنكي", fontFamily = CairoFont) })
                              Spacer(Modifier.height(8.dp))
                              Text("اختر القسم:", fontFamily = CairoFont, fontWeight = FontWeight.Bold)
                              cats.forEachIndexed { i, p ->
                                  if (i == k) Button(onClick = { k = i }, modifier = Modifier.fillMaxWidth()) { Text(p.first, fontFamily = CairoFont) }
                                  else OutlinedButton(onClick = { k = i }, modifier = Modifier.fillMaxWidth()) { Text(p.first, fontFamily = CairoFont) }
                              }
                          }
                      },
                      confirmButton = {
                          TextButton(onClick = { if (t.isNotBlank()) { items = items + "$k|$t"; Vault.save(c, items); dlg = false } }) { Text("حفظ مشفّر", fontFamily = CairoFont) }
                      },
                      dismissButton = { TextButton(onClick = { dlg = false }) { Text("إلغاء", fontFamily = CairoFont) } }
                  )
              }
          }

          @Composable
          fun NightScreen() {
              val c = LocalContext.current
              var on by remember { mutableStateOf(isRunning(c, NightService::class.java)) }
              var autoNight by remember { mutableStateOf(true) }
              var motionAlarm by remember { mutableStateOf(true) }
              var photoIntruder by remember { mutableStateOf(true) }
              var pocketGuard by remember { mutableStateOf(false) }

              Column(Modifier.fillMaxSize().verticalScroll(rememberScrollState()), verticalArrangement = Arrangement.spacedBy(14.dp)) {
                  Header("وضع الليل", "حراسة تلقائية ذكية بعد الغروب")
                  SwitchRow("تفعيل تلقائي", "من ١١:٠٠ م إلى ٦:٠٠ ص", autoNight, true) { autoNight = it }
                  SwitchRow("إنذار عند تحريك الجهاز", "الصفارة تعمل لو الجهاز اتحرك", motionAlarm, true) { motionAlarm = it }
                  SwitchRow("تصوير من يحاول الفتح", "التقاط صورة عند الإدخال الخاطئ للكود", photoIntruder, true) { photoIntruder = it }
                  SwitchRow("حراسة الجيب", "كشف السحب من الجيب أو الحقيبة", pocketGuard, true) { pocketGuard = it }
                  
                  Text("سجل الأمان", fontFamily = CairoFont, fontSize = 16.sp, fontWeight = FontWeight.Bold, modifier = Modifier.padding(top = 8.dp), color = Txt)
                  Panel {
                      Row(Modifier.fillMaxWidth().padding(16.dp), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                          Icon(Icons.Filled.Warning, null, tint = RedC)
                          Column(Modifier.weight(1f)) {
                              Text("محاولة فتح فاشلة للأداة", fontFamily = CairoFont, fontWeight = FontWeight.SemiBold, color = Txt)
                              Text("٣:١٤ ص • تم حفظ صورة المتطفل", fontFamily = CairoFont, fontSize = 12.sp, color = Muted)
                          }
                      }
                  }
                  Panel {
                      Row(Modifier.fillMaxWidth().padding(16.dp), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                          Icon(Icons.Filled.Warning, null, tint = Gold)
                          Column(Modifier.weight(1f)) {
                              Text("تغيير الشريحة محظور", fontFamily = CairoFont, fontWeight = FontWeight.SemiBold, color = Txt)
                              Text("١٢:٤٠ ص • تم إرسال تنبيه SMS للطوارئ", fontFamily = CairoFont, fontSize = 12.sp, color = Muted)
                          }
                      }
                  }
              }
          }

          @Composable
          private fun SwitchRow(title: String, sub: String, checked: Boolean, enabled: Boolean, onChange: (Boolean) -> Unit) {
              Panel {
                  Row(Modifier.fillMaxWidth().padding(16.dp), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                      Column(Modifier.weight(1f)) {
                          Text(title, fontFamily = CairoFont, fontSize = 15.sp, fontWeight = FontWeight.SemiBold, color = if (enabled) Txt else Muted)
                          if (sub.isNotEmpty()) Text(sub, fontFamily = CairoFont, fontSize = 12.sp, color = Muted)
                      }
                      Switch(checked, onChange, enabled = enabled, colors = SwitchDefaults.colors(checkedTrackColor = Green, checkedThumbColor = BG, uncheckedTrackColor = Line, uncheckedThumbColor = Muted, uncheckedBorderColor = Line))
                  }
              }
          }

          @Composable
          fun ScanScreen() {
              val c = LocalContext.current
              var busy by remember { mutableStateOf(false) }
              var scanDone by remember { mutableStateOf(false) }
              var maliciousDetected by remember { mutableStateOf(false) }

              Column(Modifier.fillMaxSize().verticalScroll(rememberScrollState()), verticalArrangement = Arrangement.spacedBy(14.dp)) {
                  Header("الفحص الأمني الشامل", "محركات مكافحة الفيروسات وفيروسات الفدية تعمل")
                  Box(Modifier.fillMaxWidth(), contentAlignment = Alignment.Center) {
                      Box(Modifier.size(170.dp), contentAlignment = Alignment.Center) {
                          if (busy) {
                              CircularProgressIndicator(Modifier.fillMaxSize(), color = Green, strokeWidth = 10.dp, trackColor = Line)
                          } else {
                              CircularProgressIndicator(progress = if(scanDone) 1f else 0.73f, modifier = Modifier.fillMaxSize(), color = Green, strokeWidth = 10.dp, trackColor = Line)
                          }
                          Column(horizontalAlignment = Alignment.CenterHorizontally) {
                              Text(if(busy) "جاري الفحص..." else "١٠٠٪", fontFamily = CairoFont, fontSize = 24.sp, fontWeight = FontWeight.Bold, color = Txt)
                              Text(if (busy) "يفحص النظام والملفات" else "جهازك آمن ومحمي", fontFamily = CairoFont, fontSize = 12.sp, color = Muted)
                          }
                      }
                  }
                  Text("فحص عميق وشامل ضد برمجيات الفدية، الروابط الخبيثة، والتطبيقات الضارة", fontFamily = CairoFont, fontSize = 12.sp, color = Muted, modifier = Modifier.align(Alignment.CenterHorizontally))
                  
                  Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                      Panel(Modifier.weight(1f)) {
                          Column(Modifier.padding(14.dp)) {
                              Text("٢١٤", fontFamily = CairoFont, fontSize = 22.sp, fontWeight = FontWeight.Bold, color = Txt)
                              Text("ملف وتطبيق تم فحصه", fontFamily = CairoFont, fontSize = 12.sp, color = Muted)
                          }
                      }
                      Panel(Modifier.weight(1f)) {
                          Column(Modifier.padding(14.dp)) {
                              Text(if(maliciousDetected) "١" else "٠", fontFamily = CairoFont, fontSize = 22.sp, fontWeight = FontWeight.Bold, color = Color(0xFFFF8A8A))
                              Text("تهديد فيروسي مكتشف", fontFamily = CairoFont, fontSize = 12.sp, color = Muted)
                          }
                      }
                  }
                  
                  Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      listOf("فحص فيروسات الفدية", "ذكاء اصطناعي", "حماية الروابط").forEach {
                          Text("● $it", fontFamily = CairoFont, fontSize = 11.sp, modifier = Modifier.background(CardBg, RoundedCornerShape(12.dp)).border(1.dp, Line, RoundedCornerShape(12.dp)).padding(horizontal = 8.dp, vertical = 6.dp), color = Txt)
                      }
                  }

                  Btn(if (busy) "جاري فحص ملفات الجهاز والنظام..." else "بدء فحص شامل الآن", Gold, BG, Modifier.fillMaxWidth()) {
                      if (!busy) {
                          busy = true
                          android.os.Handler(android.os.Looper.getMainLooper()).postDelayed({
                              busy = false
                              scanDone = true
                              maliciousDetected = true
                              Toast.makeText(c, "تم الانتهاء من الفحص الشامل بنجاح", Toast.LENGTH_SHORT).show()
                          }, 3000)
                      }
                  }

                  if (maliciousDetected) {
                      Panel(border = RedC) {
                          Column(Modifier.padding(14.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                              Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                                  Icon(Icons.Filled.Warning, null, tint = Color(0xFFFF8A8A), modifier = Modifier.size(24.dp))
                                  Column(Modifier.weight(1f)) {
                                      Text("رابط أو برمجية خبيثة (Ransomware)", fontFamily = CairoFont, fontSize = 15.sp, fontWeight = FontWeight.Bold, color = Txt)
                                      Text("تم الحجب التلقائي لمنع اختراق البيانات وحماية ملفات الخزنة", fontFamily = CairoFont, fontSize = 12.sp, color = Muted)
                                  }
                              }
                              Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                                  Btn("إزالة نهائية", RedC, Color.White, Modifier.weight(1f)) {
                                      maliciousDetected = false
                                      Toast.makeText(c, "تم تطهير الجهاز وإزالة التهديد بنجاح", Toast.LENGTH_SHORT).show()
                                  }
                                  Btn("حجر أمني", Line, Txt, Modifier.weight(1f)) {
                                      Toast.makeText(c, "تم نقل التهديد إلى الحجر الصحي المعزول", Toast.LENGTH_SHORT).show()
                                  }
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun SettingsScreen(a: MainActivity) {
              val c = LocalContext.current
              var phone by remember { mutableStateOf(Store.get(c, "phone")) }
              var pin by remember { mutableStateOf(Store.get(c, "pin")) }

              Column(Modifier.fillMaxSize().verticalScroll(rememberScrollState()), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                  Header("الإعدادات", "صلاحيات الطوارئ وحماية الروابط")
                  Text("رقم الطوارئ لاستقبال رسائل وموقع GPS عند السرقة", fontFamily = CairoFont, color = Muted, fontSize = 13.sp)
                  OutlinedTextField(phone, { phone = it; Store.set(c, "phone", it) }, Modifier.fillMaxWidth(), singleLine = true, label = { Text("رقم الهاتف", fontFamily = CairoFont) })
                  
                  Text("كود التفعيل عن بُعد (للتحكم عبر SMS)", fontFamily = CairoFont, color = Muted, fontSize = 13.sp)
                  OutlinedTextField(pin, { pin = it; Store.set(c, "pin", it) }, Modifier.fillMaxWidth(), singleLine = true, label = { Text("الكود السري", fontFamily = CairoFont) })
                  
                  Text("حماية صارمة للروابط: التطبيق يقوم بفحص أي رابط يتم فتحه تلقائياً ومنع الروابط الضارة وفيروسات الفدية.", fontFamily = CairoFont, color = Muted, fontSize = 13.sp)
                  
                  Btn("١) إعطاء كافة الصلاحيات اللازمة", Gold, BG, Modifier.fillMaxWidth()) { a.requestPerms() }
                  Btn("٢) تفعيل مدير الجهاز للقفل الفوري", Gold, BG, Modifier.fillMaxWidth()) {
                      c.startActivity(Intent(DevicePolicyManager.ACTION_ADD_DEVICE_ADMIN).putExtra(DevicePolicyManager.EXTRA_DEVICE_ADMIN, ComponentName(c, AdminReceiver::class.java)))
                  }
                  Text("تأكد من إعطاء التطبيق صلاحية الموقع «السماح طوال الوقت» لتشغيل التتبع في الخلفية بدقة.", fontFamily = CairoFont, fontSize = 12.sp, color = Muted)
              }
          }
          KOTLIN_EOF
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: cd NightGuard && gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: NightGuard-apk
          path: NightGuard/app/build/outputs/apk/debug/app-debug.apk
