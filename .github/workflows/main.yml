name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q NightGuard.zip
      - name: Fix UI code
        run: |
          F=NightGuard/app/src/main/java/com/nightguard/app/MainActivity.kt
          sed -i 's/^private val Red = ButtonDefaults.buttonColors(\(.*\))$/@Composable\nprivate fun redBtn() = ButtonDefaults.buttonColors(\1)/' $F
          sed -i 's/colors = Red/colors = redBtn()/g' $F
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: cd NightGuard && gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: NightGuard-apk
          path: NightGuard/app/build/outputs/apk/debug/app-debug.apk
