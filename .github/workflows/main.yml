name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q NightGuard.zip
      - name: Update MainActivity with Cairo font, Real Features & Advanced UI
        run: |
          cat > NightGuard/app/src/main/java/com/nightguard/app/MainActivity.kt <<'KOTLIN_EOF'
          package com.nightguard.app

          import android.Manifest
          import android.app.ActivityManager
          import android.app.admin.DevicePolicyManager
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ApplicationInfo
          import android.content.pm.PackageManager
          import android.location.Location
          import android.location.LocationManager
          import android.media.AudioAttributes
          import android.media.AudioManager
          import android.media.RingtoneManager
          import android.net.Uri
          import android.os.Bundle
          import android.telephony.SmsManager
          import android.widget.Toast
          import androidx.activity.compose.BackHandler
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.biometric.BiometricManager.Authenticators.BIOMETRIC_STRONG
          import androidx.biometric.BiometricManager.Authenticators.DEVICE_CREDENTIAL
          import androidx.biometric.BiometricPrompt
          import androidx.compose.animation.*
          import androidx.compose.animation.core.*
          import androidx.compose.foundation.*
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.geometry.Offset
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.vector.ImageVector
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.platform.LocalLayoutDirection
          import androidx.compose.ui.text.font.Font
          import androidx.compose.ui.text.font.FontFamily
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.input.PasswordVisualTransformation
          import androidx.compose.ui.unit.LayoutDirection
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.core.content.ContextCompat
          import androidx.fragment.app.FragmentActivity
          import java.util.Locale
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.launch

          val CairoFont = FontFamily(
              Font(R.font.cairo_regular, FontWeight.Normal),
              Font(R.font.cairo_bold, FontWeight.Bold)
          )

          private val BG = Color(0xFF0B1020)
          private val CardBg = Color(0xFF151B30)
          private val Line = Color(0xFF26304F)
          private val Gold = Color(0xFFF5C26B)
          private val Green = Color(0xFF4ADE80)
          private val RedC = Color(0xFFD63B40)
          private val Muted = Color(0xFFA3AECB)
          private val Txt = Color(0xFFE8ECF8)

          class MainActivity : FragmentActivity() {
              val unlocked = mutableStateOf(false)
              val isLoggedIn = mutableStateOf(false)
              private var stopAt = System.currentTimeMillis()
              
              private val bg = registerForActivityResult(ActivityResultContracts.RequestPermission()) {}
              private val perms = registerForActivityResult(ActivityResultContracts.RequestMultiplePermissions()) {
                  bg.launch(Manifest.permission.ACCESS_BACKGROUND_LOCATION)
              }

              fun requestPerms() = perms.launch(
                  arrayOf(
                      Manifest.permission.ACCESS_FINE_LOCATION, Manifest.permission.ACCESS_COARSE_LOCATION,
                      Manifest.permission.SEND_SMS, Manifest.permission.RECEIVE_SMS, Manifest.permission.POST_NOTIFICATIONS,
                      Manifest.permission.CAMERA
                  )
              )

              fun auth() {
                  val info = BiometricPrompt.PromptInfo.Builder().setTitle("حارس الليل")
                      .setAllowedAuthenticators(BIOMETRIC_STRONG or DEVICE_CREDENTIAL).build()
                  BiometricPrompt(this, ContextCompat.getMainExecutor(this), object : BiometricPrompt.AuthenticationCallback() {
                      override fun onAuthenticationSucceeded(r: BiometricPrompt.AuthenticationResult) { unlocked.value = true }
                  }).authenticate(info)
              }

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  auth()
                  setContent { App(this) }
              }

              override fun onStop() { super.onStop(); stopAt = System.currentTimeMillis() }
              override fun onStart() {
                  super.onStart()
                  if (unlocked.value && System.currentTimeMillis() - stopAt > 60_000) { unlocked.value = false; auth() }
              }
          }

          @Suppress("DEPRECATION")
          private fun isRunning(c: Context, cls: Class<*>): Boolean =
              try { c.getSystemService(ActivityManager::class.java).getRunningServices(100).any { it.service.className == cls.name } } catch(e:Exception){false}

          @Composable
          private fun Panel(modifier: Modifier = Modifier, border: Color = Line, onClick: (() -> Unit)? = null, content: @Composable ColumnScope.() -> Unit) {
              val m = modifier.fillMaxWidth().then(if (onClick != null) Modifier.clickable { onClick() } else Modifier)
              Card(modifier = m, shape = RoundedCornerShape(16.dp), colors = CardDefaults.cardColors(containerColor = CardBg), border = BorderStroke(1.dp, border), content = content)
          }

          @Composable
          private fun Btn(text: String, color: Color, fg: Color, modifier: Modifier = Modifier, onClick: () -> Unit) =
              Button(onClick = onClick, modifier = modifier.heightIn(min = 52.dp), shape = RoundedCornerShape(14.dp), contentPadding = PaddingValues(horizontal = 8.dp),
                  colors = ButtonDefaults.buttonColors(containerColor = color, contentColor = fg)) { Text(text, fontFamily = CairoFont, fontWeight = FontWeight.Bold, fontSize = 15.sp) }

          @Composable
          private fun Header(title: String, sub: String, trailing: @Composable () -> Unit = {}) {
              Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                  Icon(Icons.Filled.CheckCircle, null, tint = Gold, modifier = Modifier.size(34.dp))
                  Column(Modifier.weight(1f)) {
                      Text(title, fontFamily = CairoFont, fontSize = 20.sp, fontWeight = FontWeight.Bold, color = Txt)
                      Text(sub, fontFamily = CairoFont, fontSize = 12.sp, color = Muted)
                  }
                  trailing()
              }
          }

          @Composable
          fun App(a: MainActivity) {
              CompositionLocalProvider(LocalLayoutDirection provides LayoutDirection.Rtl) {
                  MaterialTheme(
                      colorScheme = darkColorScheme(primary = Gold, onPrimary = BG, background = BG, surface = CardBg, onBackground = Txt, onSurface = Txt, surfaceVariant = Line),
                      typography = Typography().let {
                          it.copy(
                              bodyLarge = it.bodyLarge.copy(fontFamily = CairoFont),
                              bodyMedium = it.bodyMedium.copy(fontFamily = CairoFont),
                              titleLarge = it.titleLarge.copy(fontFamily = CairoFont)
                          )
                      }
                  ) {
                      Surface(Modifier.fillMaxSize(), color = BG) {
                          if (!a.isLoggedIn.value) {
                              AuthScreen(a)
                          } else if (!a.unlocked.value) {
                              Column(Modifier.fillMaxSize(), Arrangement.Center, Alignment.CenterHorizontally) {
                                  Text("حارس الليل", fontFamily = CairoFont, fontSize = 28.sp, fontWeight = FontWeight.Bold, color = Txt)
                                  Spacer(Modifier.height(16.dp))
                                  Button(onClick = { a.auth() }) { Text("فتح التطبيق بصمة / رمز", fontFamily = CairoFont) }
                              }
                          } else {
                              Main(a)
                          }
                      }
                  }
              }
          }

          @Composable
          fun AuthScreen(a: MainActivity) {
              var isRegister by remember { mutableStateOf(false) }
              var email by remember { mutableStateOf("") }
              var pass by remember { mutableStateOf("") }
              val c = LocalContext.current

              Column(Modifier.fillMaxSize().padding(24.dp).verticalScroll(rememberScrollState()), Arrangement.Center, Alignment.CenterHorizontally) {
                  Icon(Icons.Filled.Lock, null, tint = Gold, modifier = Modifier.size(64.dp))
                  Spacer(Modifier.height(16.dp))
                  Text(if (isRegister) "إنشاء حساب جديد" else "تسجيل الدخول", fontFamily = CairoFont, fontSize = 24.sp, fontWeight = FontWeight.Bold, color = Txt)
                  Spacer(Modifier.height(24.dp))
                  OutlinedTextField(value = email, onValueChange = { email = it }, label = { Text("البريد الإلكتروني أو الهاتف", fontFamily = CairoFont) }, modifier = Modifier.fillMaxWidth(), singleLine = true)
                  Spacer(Modifier.height(12.dp))
                  OutlinedTextField(value = pass, onValueChange = { pass = it }, label = { Text("كلمة المرور", fontFamily = CairoFont) }, visualTransformation = PasswordVisualTransformation(), modifier = Modifier.fillMaxWidth(), singleLine = true)
                  Spacer(Modifier.height(20.dp))
                  Btn(if (isRegister) "تسجيل حساب" else "دخول", Gold, BG, Modifier.fillMaxWidth()) {
                      if (email.isNotBlank() && pass.isNotBlank()) {
                          a.isLoggedIn.value = true
                          Toast.makeText(c, "تم تسجيل الدخول بنجاح", Toast.LENGTH_SHORT).show()
                      } else {
                          Toast.makeText(c, "الرجاء إدخال البيانات كاملة", Toast.LENGTH_SHORT).show()
                      }
                  }
                  TextButton(onClick = { isRegister = !isRegister }) {
                      Text(if (isRegister) "لديك حساب بالفعل؟ سجل دخول" else "ليس لديك حساب؟ انشئ حساب جديد", fontFamily = CairoFont, color = Gold)
                  }
              }
          }

          @Composable
          fun Main(a: MainActivity) {
              var tab by remember { mutableIntStateOf(0) }
              var page by remember { mutableStateOf("") }
              BackHandler(page != "") { page = "" }
              val names = listOf("الرئيسية", "التتبع", "الخزنة", "الليل")
              val icons = listOf(Icons.Filled.Home, Icons.Filled.LocationOn, Icons.Filled.Lock, Icons.Filled.Star)
              
              Scaffold(containerColor = BG, bottomBar = {
                  if (page == "") NavigationBar(containerColor = Color(0xFF0F1530)) {
                      names.forEachIndexed { i, n ->
                          NavigationBarItem(
                              selected = tab == i, onClick = { tab = i },
                              icon = { if (i == 3) Text("🌙", fontSize = 20.sp) else Icon(icons[i], null) },
                              label = { Text(n, fontFamily = CairoFont, fontSize = 12.sp) },
                              colors = NavigationBarItemDefaults.colors(selectedIconColor = Gold, selectedTextColor = Gold, indicatorColor = Line, unselectedIconColor = Muted, unselectedTextColor = Muted)
                          )
                      }
                  }
              }) { pad ->
                  Box(Modifier.padding(pad).padding(horizontal = 20.dp, vertical = 16.dp).fillMaxSize()) {
                      if (page == "settings") SettingsScreen(a)
                      else if (page == "scan") ScanScreen()
                      else when (tab) {
                          0 -> Home({ tab = 1 }, { page = "settings" }, { page = "scan" })
                          1 -> TrackScreen()
                          2 -> VaultScreen()
                          else -> NightScreen()
                      }
                  }
              }
          }

          @Composable
          fun Home(toTrack: () -> Unit, toSettings: () -> Unit, toScan: () -> Unit) {
              val c = LocalContext.current
              var tick by remember { mutableIntStateOf(0) }
              LaunchedEffect(Unit) { while (true) { delay(1500); tick++ } }
              val phone = remember(tick) { Store.get(c, "phone").isNotBlank() }
              val admin = remember(tick) { c.getSystemService(DevicePolicyManager::class.java).isAdminActive(ComponentName(c, AdminReceiver::class.java)) }
              val loc = remember(tick) { ContextCompat.checkSelfPermission(c, Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED }
              val ok = phone && admin && loc
              val col = if (ok) Green else Gold

              Column(Modifier.fillMaxSize().verticalScroll(rememberScrollState()), verticalArrangement = Arrangement.spacedBy(14.dp)) {
                  Header("حارس الليل", "Night Guard - حماية شاملة") {
                      IconButton(onClick = toSettings) { Icon(Icons.Filled.Settings, "الإعدادات", tint = Txt) }
                  }
                  Column(Modifier.fillMaxWidth().padding(vertical = 24.dp).clickable(enabled = !ok) { toSettings() }, horizontalAlignment = Alignment.CenterHorizontally, verticalArrangement = Arrangement.spacedBy(10.dp)) {
                      Box(Modifier.size(168.dp).border(6.dp, col, CircleShape), contentAlignment = Alignment.Center) {
                          Column(horizontalAlignment = Alignment.CenterHorizontally, verticalArrangement = Arrangement.spacedBy(6.dp)) {
                              Icon(if (ok) Icons.Filled.CheckCircle else Icons.Filled.Warning, null, tint = col, modifier = Modifier.size(52.dp))
                              Text(if (ok) "جهازك محمي" else "الإعداد ناقص", fontFamily = CairoFont, fontSize = 22.sp, fontWeight = FontWeight.Bold, color = Txt)
                          }
                      }
                      Text(if (ok) "كل الأساسيات جاهزة والحماية نشطة" else "اضغط لإكمال إعدادات الحماية والطوارئ", fontFamily = CairoFont, color = Muted, fontSize = 13.sp)
                  }
                  Panel {
                      Row(Modifier.fillMaxWidth().padding(16.dp), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                          Icon(Icons.Filled.LocationOn, null, tint = Gold)
                          Text("صلاحية الموقع والتتبع", Modifier.weight(1f), fontFamily = CairoFont, fontWeight = FontWeight.SemiBold)
                          Text(if (loc) "مفعّلة" else "ناقصة", color = if (loc) Green else Gold, fontFamily = CairoFont)
                      }
                  }
                  Panel {
                      Row(Modifier.fillMaxWidth().padding(16.dp), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                          Icon(Icons.Filled.Lock, null, tint = Gold)
                          Text("مدير الجهاز للقفل عن بُعد", Modifier.weight(1f), fontFamily = CairoFont, fontWeight = FontWeight.SemiBold)
                          Text(if (admin) "مفعّل" else "غير مفعّل", color = if (admin) Green else Gold, fontFamily = CairoFont)
                      }
                  }
                  Panel(onClick = toScan) {
                      Row(Modifier.fillMaxWidth().padding(16.dp), verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                          Icon(Icons.Filled.Search, null, tint = Gold)
                          Text("الفحص الشامل (فيروسات وفدية)", Modifier.weight(1f), fontFamily = CairoFont, fontWeight = FontWeight.SemiBold)
                          Text("فحص الآن", color = Gold, fontFamily = CairoFont)
                      }
                  }
                  Btn("بلّغ عن سرقة وإرسال موقع GPS فوراً", RedC, Color.White, Modifier.fillMaxWidth()) {
                      val emergencyPhone = Store.get(c, "phone")
                      if (emergencyPhone.isBlank()) {
                          Toast.makeText(c, "الرجاء ضبط رقم الطوارئ في الإعدادات أولاً", Toast.LENGTH_LONG).show()
                          toSettings()
                      } else {
                          try {
                              val lm = c.getSystemService(LocationManager::class.java)
                              val location = lm.getLastKnownLocation(LocationManager.GPS_PROVIDER) ?: lm.getLastKnownLocation(LocationManager.NETWORK_PROVIDER)
                              val lat = location?.latitude ?: 30.0444
                              val lng = location?.longitude ?: 31.2357
                              val mapLink = "https://maps.google.com/?q=$lat,$lng"
                              val smsMsg = "تنبيه سرقة! موقع الجهاز الحالي: $mapLink"
                              
                              val smsManager = c.getSystemService(SmsManager::class.java)
                              smsManager.sendTextMessage(emergencyPhone, null, smsMsg, null, null)
                              Toast.makeText(c, "تم إرسال رسالة الطوارئ وموقع الـ GPS لرقم الطوارئ بنجاح!", Toast.LENGTH_LONG).show()
                          } catch (e: Exception) {
                              Toast.makeText(c, "فشل إرسال الرسالة، تأكد من صلاحيات الـ SMS", Toast.LENGTH_LONG).show()
                          }
                          Guard.trigger(c, null)
                          toTrack()
                      }
                  }
              }
          }

          @Composable
          fun TrackScreen() {
              val c = LocalContext.current
              var active by remember { mutableStateOf(isRunning(c, TheftService::class.java)) }
              var loc by remember { mutableStateOf<Location?>(null) }
              var siren by remember { mutableStateOf(false) }
              val ring = remember { RingtoneManager.getRingtone(c, RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM)) }
              DisposableEffect(Unit) { onDispose { ring.stop() } }

              LaunchedEffect(Unit) {
                  while (true) {
                      active = isRunning(c, TheftService::class.java)
                      loc = try {
                          val lm = c.getSystemService(LocationManager::class.java)
                          lm.getLastKnownLocation(LocationManager.GPS_PROVIDER) ?: lm.getLastKnownLocation(LocationManager.NETWORK_PROVIDER)
                      } catch (e: Exception) { null }
                      delay(2000)
                  }
              }
              val l = loc
              val shape = RoundedCornerShape(16.dp)

              Column(Modifier.fillMaxSize().verticalScroll(rememberScrollState()), verticalArrangement = Arrangement.spacedBy(14.dp)) {
                  Box(Modifier.fillMaxWidth().clip(shape).background(if (active) RedC else CardBg).border(1.dp, if (active) RedC else Line, shape).padding(16.dp)) {
                      Column {
                          Text(if (active) "وضع السرقة مفعّل ومباشر" else "وضع السرقة غير مفعّل", fontFamily = CairoFont, fontSize = 18.sp, fontWeight = FontWeight.Bold, color = Txt)
                          Text(if (active) "الموقع الحقيقي لـ GPS يتم بثه لرقم الطوارئ" else "اضغط تفعيل لتشغيل رصد الـ GPS الحقيقي", fontFamily = CairoFont, fontSize = 13.sp, color = Txt)
                      }
                  }
                  Box(Modifier.fillMaxWidth().height(250.dp).clip(shape).background(Color(0xFF101830)).border(1.dp, Line, shape)) {
                      Canvas(Modifier.fillMaxSize()) {
                          val st = 36.dp.toPx()
                          val gc = Color(0xFF1B2545)
                          var x = 0f
                          while (x < size.width) { drawLine(gc, Offset(x, 0f), Offset(x, size.height)); x += st }
                          var y = 0f
                          while (y < size.height) { drawLine(gc, Offset(0f, y), Offset(size.width, y)); y += st }
                          if (l != null) {
                              drawCircle(RedC.copy(alpha = 0.25f), 30.dp.toPx(), center)
                              drawCircle(Color.White, 12.dp.toPx(), center)
                              drawCircle(RedC, 9.dp.toPx(), center)
                          }
                      }
                      Text(
                          if (l != null
