name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: unzip -q NightGuard.zip
      - name: Restore app code
        run: |
          python3 - <<'PY'
          import re, subprocess
          def sh(*a):
              return subprocess.run(a, capture_output=True, text=True).stdout.replace("\r\n", "\n")
          commits = sh('git', 'log', '--format=%H', '--', '.github/workflows/main.yml').split()
          print('commits in history:', len(commits))
          for tag in ('KOTLIN', 'AV'):
              m = tag + '_EOF'
              pat = re.compile(r"cat\s*>\s*(\S+)\s*<<\s*'" + m + r"'[ \t]*\n(.*?)\n[ \t]*" + m, re.S)
              found = None
              for h in commits:
                  t = sh('git', 'show', h + ':.github/workflows/main.yml')
                  blocks = pat.findall(t)
                  print(tag, h[:7], 'blocks:', len(blocks))
                  if blocks:
                      found = blocks
                      break
              assert found, 'no commit in history has ' + tag + ' blocks'
              for path, body in found:
                  path = path.replace('$D', 'NightGuard/app/src/main')
                  lines = body.split("\n")
                  ind = min(len(l) - len(l.lstrip(" ")) for l in lines if l.strip())
                  open(path, "w", encoding="utf-8").write("\n".join(l[ind:] for l in lines) + "\n")
                  print('restored', path)
          PY
      - name: Cairo font
        run: |
          D=NightGuard/app/src/main
          mkdir -p $D/res/font
          OK=0
          for U in "https://github.com/google/fonts/raw/main/ofl/cairo/Cairo%5Bslnt%2Cwght%5D.ttf" "https://raw.githubusercontent.com/google/fonts/main/ofl/cairo/Cairo%5Bslnt%2Cwght%5D.ttf"; do
            if curl -fsSL "$U" -o $D/res/font/cairo.ttf && [ "$(stat -c%s $D/res/font/cairo.ttf)" -gt 50000 ]; then OK=1; break; fi
          done
          if [ $OK = 1 ]; then
            printf 'package com.nightguard.app\n\nimport androidx.compose.ui.text.font.Font\nimport androidx.compose.ui.text.font.FontFamily\nimport androidx.compose.ui.text.font.FontWeight\n\nval CairoFont = FontFamily(Font(R.font.cairo, FontWeight.Normal), Font(R.font.cairo, FontWeight.Bold))\n' > $D/java/com/nightguard/app/Fonts.kt
          else
            rm -f $D/res/font/cairo.ttf
            printf 'package com.nightguard.app\n\nimport androidx.compose.ui.text.font.FontFamily\n\nval CairoFont = FontFamily.Default\n' > $D/java/com/nightguard/app/Fonts.kt
          fi
      - name: Patches
        run: |
          D=NightGuard/app/src/main
          sed -i 's/^fun ScanScreen()/fun OldScanScreen()/' $D/java/com/nightguard/app/MainActivity.kt
          grep -q "fun OldScanScreen" $D/java/com/nightguard/app/MainActivity.kt
          sed -i 's#<uses-permission android:name="android.permission.USE_BIOMETRIC" />#&\n    <uses-permission android:name="android.permission.INTERNET" />#' $D/AndroidManifest.xml
          grep -q "permission.INTERNET" $D/AndroidManifest.xml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Stable signing key
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            mkdir -p ~/.android
            echo "$KS" | base64 -d > ~/.android/debug.keystore
            keytool -list -keystore ~/.android/debug.keystore -storepass android | tail -3
          else
            echo "NO SECRET FOUND: using a random key"
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: cd NightGuard && gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: NightGuard-apk
          path: NightGuard/app/build/outputs/apk/debug/app-debug.apk
